<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGop - Advanced AI Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #chat-container {
            border: 2px solid #ccc;
            border-radius: 8px;
            width: 400px;
            max-height: 600px;
            background: #fff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #chat-box {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            border-bottom: 1px solid #ddd;
        }
        .message {
            margin: 5px 0;
            padding: 8px 10px;
            border-radius: 5px;
            max-width: 80%;
        }
        .user-message {
            background-color: #d1e7dd;
            align-self: flex-end;
            text-align: right;
        }
        .ai-message {
            background-color: #f8d7da;
            align-self: flex-start;
            text-align: left;
        }
        #input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
            background: #f9f9f9;
        }
        #user-input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        #send-btn {
            padding: 8px 15px;
            margin-left: 5px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #send-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>ChatGop - Advanced AI Chatbot</h1>
    <div id="chat-container">
        <div id="chat-box"></div>
        <div id="input-area">
            <input type="text" id="user-input" placeholder="Type your message..." onkeydown="if(event.key === 'Enter') processInput();">
            <button id="send-btn" onclick="processInput()">Send</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        let conversationHistory = [];

        function displayMessage(message, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.textContent = message;
            messageDiv.className = `message ${sender}-message`;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function processInput() {
            const userInput = document.getElementById('user-input').value.trim();
            if (userInput === '') return;

            displayMessage(userInput, 'user');
            conversationHistory.push({ role: 'user', content: userInput });
            document.getElementById('user-input').value = '';

            try {
                const response = await fetch('http://localhost:5000/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: userInput, history: conversationHistory })
                });

                const data = await response.json();
                const aiReply = data.reply;

                displayMessage(aiReply, 'ai');
                conversationHistory.push({ role: 'assistant', content: aiReply });
            } catch (error) {
                displayMessage('Error: Unable to connect to AI server.', 'ai');
            }
        }
    </script>
</body>
</html>
